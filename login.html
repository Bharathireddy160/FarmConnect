
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | FarmConnect</title>


    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Authentication CSS -->

    <link
        rel="stylesheet"
        href="css/auth.css">

</head>


<body>


<div class="auth-page">


    <!-- ==========================================
         LEFT SIDE
    =========================================== -->

    <div class="auth-image">

        <div class="image-overlay">


            <!-- LOGO -->

            <div class="auth-logo">

                <span class="logo-icon">
                    🌾
                </span>

                <div>

                    <h1>
                        FarmConnect
                    </h1>

                    <p>
                        Farmer 🤝 Customer
                    </p>

                </div>

            </div>


            <!-- MESSAGE -->

            <div class="auth-message">

                <h2>
                    Fresh From Farm,
                    <br>
                    Directly To You
                </h2>

                <p>
                    Connect directly with farmers
                    and discover fresh agricultural
                    products.
                </p>

            </div>


        </div>

    </div>



    <!-- ==========================================
         RIGHT SIDE
    =========================================== -->

    <div class="auth-container">


        <div class="auth-box">


            <!-- MOBILE LOGO -->

            <div class="mobile-logo">

                <div class="mobile-logo-icon">
                    🌾
                </div>

                <h2>
                    FarmConnect
                </h2>

                <p>
                    Farmer 🤝 Customer
                </p>

            </div>


            <!-- TITLE -->

            <h2>
                Welcome Back!
            </h2>

            <p class="subtitle">
                Login to your FarmConnect account
            </p>



            <!-- ==================================
                 USER TYPE
            =================================== -->

            <label>
                Login As
            </label>


            <div class="user-type">


                <!-- CUSTOMER -->

                <button
                    type="button"
                    class="type-btn active"
                    data-type="customer">

                    <span>
                        🛒
                    </span>

                    <span>
                        Customer
                    </span>

                </button>


                <!-- FARMER -->

                <button
                    type="button"
                    class="type-btn"
                    data-type="farmer">

                    <span>
                        👨‍🌾
                    </span>

                    <span>
                        Farmer
                    </span>

                </button>


            </div>



            <!-- ==================================
                 EMAIL
            =================================== -->

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required>



            <!-- ==================================
                 PASSWORD
            =================================== -->

            <label for="password">
                Password
            </label>


            <!-- PASSWORD WRAPPER -->

            <div class="password-wrapper">


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>


                <!-- SHOW PASSWORD BUTTON -->

                <button
                    type="button"
                    id="togglePassword"
                    class="show-password"
                    aria-label="Show password">

                    👁️

                </button>


            </div>



            <!-- ==================================
                 LOGIN BUTTON
            =================================== -->

            <button
                type="button"
                id="loginBtn"
                class="auth-btn">

                Login

            </button>



            <!-- ==================================
                 MESSAGE
            =================================== -->

            <p
                id="message"
                class="message">
            </p>



            <!-- ==================================
                 DIVIDER
            =================================== -->

            <div class="divider">

                <span>
                    OR
                </span>

            </div>



            <!-- ==================================
                 REGISTER
            =================================== -->

            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>



            <!-- ==================================
                 HOME
            =================================== -->

            <a
                href="index.html"
                class="home-link">

                ← Back to Home

            </a>


        </div>


    </div>


</div>



<!-- ==========================================
     SHOW PASSWORD JAVASCRIPT
=========================================== -->

<script>

    const passwordInput =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");


    togglePassword.addEventListener(
        "click",
        function () {

            if (
                passwordInput.type === "password"
            ) {

                passwordInput.type =
                    "text";

                togglePassword.textContent =
                    "🙈";

                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            }

            else {

                passwordInput.type =
                    "password";

                togglePassword.textContent =
                    "👁️";

                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }
    );

</script>



<!-- ==========================================
     FIREBASE LOGIN JAVASCRIPT
=========================================== -->

<script
    type="module"
    src="js/auth.js">
</script>


</body>

</html>
