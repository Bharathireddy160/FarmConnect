<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FarmConnect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/auth.css">

</head>


<body>


    <div class="auth-page">


        <!-- LEFT SIDE -->

        <div class="auth-image">

            <div class="image-overlay">

                <div class="auth-logo">

                    🌾

                    <h1>FarmConnect</h1>

                    <p>
                        Farmer 🤝 Customer
                    </p>

                </div>


                <div class="auth-message">

                    <h2>
                        Fresh From Farm,
                        <br>
                        Directly To You
                    </h2>

                    <p>
                        Connect directly with farmers
                        and discover fresh agricultural
                        products.
                    </p>

                </div>

            </div>

        </div>



        <!-- RIGHT SIDE -->

        <div class="auth-container">


            <div class="auth-box">


                <div class="mobile-logo">

                    🌾

                    <h2>FarmConnect</h2>

                    <p>Farmer 🤝 Customer</p>

                </div>


                <h2>Welcome Back!</h2>

                <p class="subtitle">
                    Login to your FarmConnect account
                </p>


                <!-- User Type -->

                <label>
                    Login As
                </label>

                <div class="user-type">

                    <button
                        type="button"
                        class="type-btn active"
                        data-type="customer">

                        🛒

                        <span>Customer</span>

                    </button>


                    <button
                        type="button"
                        class="type-btn"
                        data-type="farmer">

                        👨‍🌾

                        <span>Farmer</span>

                    </button>

                </div>


                <!-- Email -->

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- Login Button -->

                <button
                    type="button"
                    id="loginBtn"
                    class="auth-btn">

                    Login

                </button>


                <!-- Message -->

                <p
                    id="message"
                    class="message">
                </p>


                <div class="divider">

                    <span>OR</span>

                </div>


                <p class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>


                <a
                    href="index.html"
                    class="home-link">

                    ← Back to Home

                </a>


            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script
        type="module"
        src="js/auth.js">
    </script>


</body>

</html>
