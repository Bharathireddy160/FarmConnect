<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Product | FarmConnect</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/product-form.css">

</head>

<body>

<div class="form-container">

    <div class="form-box">

        <a href="farmer-dashboard.html"
           class="back-link">
            ← Back to Dashboard
        </a>

        <h1>🌾 Add New Product</h1>

        <p class="subtitle">
            Add your agricultural product for customers.
        </p>


        <form id="productForm">

            <label for="productName">
                Product Name
            </label>

            <input
                type="text"
                id="productName"
                placeholder="Example: Fresh Tomatoes"
                required
            >


            <label for="category">
                Category
            </label>

            <select id="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Vegetables">
                    Vegetables
                </option>

                <option value="Fruits">
                    Fruits
                </option>

                <option value="Grains">
                    Grains
                </option>

                <option value="Pulses">
                    Pulses
                </option>

                <option value="Dairy">
                    Dairy
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label for="price">
                Price per kg (₹)
            </label>

            <input
                type="number"
                id="price"
                min="1"
                placeholder="Example: 40"
                required
            >


            <label for="quantity">
                Available Quantity (kg)
            </label>

            <input
                type="number"
                id="quantity"
                min="1"
                placeholder="Example: 100"
                required
            >


            <label for="location">
                Farm Location
            </label>

            <input
                type="text"
                id="location"
                placeholder="Example: Vijayawada"
                required
            >


            <label for="description">
                Product Description
            </label>

            <textarea
                id="description"
                rows="5"
                placeholder="Describe your product..."
                required
            ></textarea>


            <label for="productImage">
                Product Image
            </label>

            <input
                type="file"
                id="productImage"
                accept="image/*"
            >


            <button
                type="submit"
                id="addProductBtn">
                Add Product
            </button>

            <p id="message"></p>

        </form>

    </div>

</div>


<script
    type="module"
    src="js/add-product.js">
</script>

</body>
</html>
